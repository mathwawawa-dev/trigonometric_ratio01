    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, query, orderByChild, remove } 
    from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCaAsJrR3ACNFyteIwWoyOsyeCm5SHY-Bs",
      authDomain: "linear-and-number-grade7.firebaseapp.com",
      databaseURL: "https://linear-and-number-grade7-default-rtdb.firebaseio.com",
      projectId: "linear-and-number-grade7",
      storageBucket: "linear-and-number-grade7.firebasestorage.app",
      messagingSenderId: "271768536680",
      appId: "1:271768536680:web:872bff86043259d3f41ddd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.saveRecordToDB = function(nickname, finalScore, totalTime, accuracy) {
      const today = new Date();
      const dateString = `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;
      const recordsRef = ref(db, 'hallOfFame_linear'); // DB 경로를 일차식용으로 분리
      const newRecordRef = push(recordsRef);
      
      set(newRecordRef, {
        name: nickname,         
        score: finalScore,
        time: totalTime,
        accuracy: accuracy,
        date: dateString,
        timestamp: Date.now()
      }).catch((error) => console.error("등록 실패: ", error));
    };

    window.loadLeaderboard = function(callback) {
      const recordsRef = ref(db, 'hallOfFame_linear');
      const topScoresQuery = query(recordsRef, orderByChild('score')); 

      onValue(topScoresQuery, (snapshot) => {
        let records = [];
        snapshot.forEach((childSnapshot) => {
          records.push({ id: childSnapshot.key, ...childSnapshot.val() });
        });
        records.reverse(); 
        callback(records);
      });
    };

    window.deleteRecordFromDB = function(recordId, onSuccess) {
      const recordRef = ref(db, `hallOfFame_linear/${recordId}`);
      remove(recordRef).then(() => {
        if (onSuccess) onSuccess(); 
      }).catch((error) => {
        console.error("삭제 권한이 없거나 오류가 발생했습니다: ", error);
      });
    };

      let currentIndex = array.length, randomIndex;
      while (currentIndex !== 0) {

        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];

       return val;
    };

    const parseLinearExpression = (str) => {
      let s = String(str).replace(/\s+/g, '').replace(/−/g, '-');
      let degree = 0; // 상수항 처리를 위해 기본값을 0으로 변경
      let coeff = 0;
      let constant = 0;

      if (/[a-zA-Z]/.test(s)) {
          degree = s.includes('^2') ? 2 : 1;
      }

      const terms = s.match(/[+-]?[^+-]+/g);
      if (terms) {
         terms.forEach(term => {
            if (/[a-zA-Z]/.test(term)) {
               let cStr = term.replace(/[a-zA-Z](?:\^[0-9]+)?/g, '');
               if (cStr === '' || cStr === '+') coeff += 1;
               else if (cStr === '-') coeff += -1;
               else coeff += parseInt(cStr, 10);
            } else {
               constant += parseInt(term, 10);
            }
         });
      }
      return { degree, coeff, constant };
    };

    // [핵심] 5-Bag 시스템과 엄격한 수학적 오름차순 정렬을 혼합하여 선지를 생성하는 함수
    const generateOptionsList = (ansStr, trap1, trap2, v, targetPos) => {
        const fixedText = "다른 것은 답이 아니다.";
        
        // 정렬 규칙: 1. 일차항 (1) -> 2. 이차항 (2) -> 3. 상수항 (3)
        const getTypeOrder = (degree) => {
            if (degree === 1) return 1;
            if (degree === 2) return 2;
            if (degree === 0) return 3;
            return 4;
        };

        // 완벽한 수학적 오름차순 비교 함수
        const compareParsed = (valA, valB) => {
            let typeA = getTypeOrder(valA.degree);
            let typeB = getTypeOrder(valB.degree);
            // 1. 차수 기준 정렬 (일차항 -> 이차항 -> 상수항)
            if (typeA !== typeB) return typeA - typeB;

            // 2. 일차항/이차항일 경우: 계수 오름차순 정렬
            if (valA.degree !== 0) {
                if (valA.coeff !== valB.coeff) return valA.coeff - valB.coeff;
            }
            // 3. 계수가 같거나 상수항 그룹인 경우: 상수항 오름차순 정렬
            return valA.constant - valB.constant;
        };

        // 텍스트 정답인 경우의 예외 처리
        if (ansStr === fixedText) {
            const wrongSet = new Set();
            if (trap1 && trap1 !== fixedText) wrongSet.add(trap1);
            if (trap2 && trap2 !== fixedText) wrongSet.add(trap2);
            
            let attempts = 0;
            while (wrongSet.size < 5 && attempts < 200) {
                attempts++;
                let rC = randInt(-10, 10);
                let rConst = randInt(-10, 10, false);
                let opt = joinTerms(fmtTerm(rC, v, true), fmtTerm(rConst, "", false));
                if (opt !== fixedText) wrongSet.add(opt);
            }
            
            let arr = Array.from(wrongSet).sort((a, b) => compareParsed(parseLinearExpression(a), parseLinearExpression(b)));
            arr.push(fixedText);
            return arr;
        }

        // --- 수학 식 정답에 대한 동적 타겟 배치 및 찍기방지(2x2) 교사 로직 ---
        const ansParsed = parseLinearExpression(ansStr);
        let correctA = ansParsed.coeff;
        let correctB = ansParsed.constant;

        // 5-Bag에서 지정된 목표 위치
        let pos = targetPos !== null ? targetPos : Math.floor(Math.random() * 5);
        
        // 목표 위치에 맞추기 위해 필요한 '정답보다 작은 선지'와 '큰 선지'의 개수
        let smallerNeeded = pos;
        let largerNeeded = 4 - pos;

        const smallerSet = new Set();
        const largerSet = new Set();

        // 헬퍼: 생성된 오답을 크기 비교하여 알맞은 Set에 넣는 함수
        const addTrap = (a, b) => {
            let str = joinTerms(fmtTerm(a, v, true), fmtTerm(b, "", false));
            if (str === fixedText || str === ansStr || str === "") return;
            const parsed = parseLinearExpression(str);
            const cmp = compareParsed(parsed, ansParsed);
            if (cmp < 0 && smallerSet.size < smallerNeeded) smallerSet.add(str);
            if (cmp > 0 && largerSet.size < largerNeeded) largerSet.add(str);
        };

        const addRawTrap = (str) => {
            if (!str || str === fixedText || str === ansStr) return;
            const parsed = parseLinearExpression(str);
            const cmp = compareParsed(parsed, ansParsed);
            if (cmp < 0 && smallerSet.size < smallerNeeded) smallerSet.add(str);
            if (cmp > 0 && largerSet.size < largerNeeded) largerSet.add(str);
        }
        
        // 기본 문제 로직에서 제공된 함정 우선 배정
        addRawTrap(trap1);
        addRawTrap(trap2);

        // [찍기방지] 2x2 일차/상수항 꼼수 방지용 기본 재료 생성
        let wrongA = correctA !== 0 ? correctA + (Math.random() < 0.5 ? 2 : -2) : (Math.random() < 0.5 ? 2 : -2); 
        if (wrongA === 0 && correctA !== 0) wrongA = correctA > 0 ? correctA + 2 : correctA - 2;
        let wrongB = correctB + (Math.random() < 0.5 ? 3 : -3); 
        
        // 2x2 교차 함정 배정 시도 (크기 비교 후 알아서 smaller/larger로 들어감)
        addTrap(correctA, wrongB);
        addTrap(wrongA, correctB);
        addTrap(wrongA, wrongB);

        // 그래도 목표 개수가 부족하다면 동적으로 추가 생성
        let attempt = 1;
        while ((smallerSet.size < smallerNeeded || largerSet.size < largerNeeded) && attempt < 100) {
            if (correctA === 0) { // 정답이 상수항일 경우 특별 처리
                if (smallerSet.size < smallerNeeded) {
                    addTrap(0, correctB - attempt);
                    addTrap(attempt, correctB); // 일차항은 상수항보다 무조건 앞에 정렬됨
                    addTrap(-attempt, correctB); 
                }
                if (largerSet.size < largerNeeded) {
                    addTrap(0, correctB + attempt); // 상수항보다 큰 건 더 큰 상수항뿐
                }
            } else {
                if (smallerSet.size < smallerNeeded) {
                    addTrap(correctA - attempt, correctB);
                    addTrap(correctA, correctB - attempt);
                    addTrap(correctA - attempt, correctB - attempt);
                }
                if (largerSet.size < largerNeeded) {
                    addTrap(correctA + attempt, correctB);
                    addTrap(correctA, correctB + attempt);
                    addTrap(correctA + attempt, correctB + attempt);
                }
            }
            attempt++;
        }

        // 완성된 smaller 배열, 정답, larger 배열을 합침 (자연스럽게 정답이 targetPos에 위치)
        let finalMath = [...Array.from(smallerSet), ansStr, ...Array.from(largerSet)];
        
        // 만에 하나 중복이나 누락으로 5개가 안 될 경우를 대비한 안전 장치
        let fallbackAttempt = 1;
        while (finalMath.length < 5 && fallbackAttempt < 100) {
            let rC = randInt(-10 - fallbackAttempt, 10 + fallbackAttempt);
            let rConst = randInt(-10 - fallbackAttempt, 10 + fallbackAttempt, false);
            let str = joinTerms(fmtTerm(rC, v, true), fmtTerm(rConst, "", false));
            if (str !== fixedText && !finalMath.includes(str) && str !== "") {
                finalMath.push(str);
            }
            fallbackAttempt++;
        }

        // 전체를 다시 한번 완벽하게 오름차순 정렬
        finalMath.sort((a, b) => compareParsed(parseLinearExpression(a), parseLinearExpression(b)));
        
        // 6번 선지 고정
        finalMath.push(fixedText);

        return finalMath;
    };

    // 일차식 문제 생성기 (7가지 유형 통합) 및 상세 힌트 생성
    const generateLinearQuestion = (type, allowNeg, targetPos = null) => {
      const vars = ['a', 'x'];
      const v = vars[Math.floor(Math.random() * vars.length)];
      let expr = "", ans = "", hint = "", trap1 = "", trap2 = "";

      switch(type) {
        case 1: // 단항식 * 수
          {
            let a = getC(-9, 9, allowNeg);
            let b = getMultiplier(-9, 9, allowNeg);
            expr = `${fmtTerm(a, v, true)} × ${b < 0 ? '('+b+')' : b}`;
            ans = fmtTerm(a*b, v, true) || "0";
            hint = `<단항식과 수의 곱셈>\n① 숫자는 숫자끼리 먼저 곱합니다.\n👉 ${a} × ${b} = ${a*b}\n② ①의 결과 뒤에 문자 ${v}를 그대로 붙여줍니다.`;
            trap1 = fmtTerm(a+b, v, true) || "0";
            trap2 = (a*b).toString();
          }
          break;
        case 2: // 단항식 / 수
          {
            let b = getMultiplier(-5, 5, allowNeg);
            let ansC = getC(-5, 5, allowNeg);
            let a = ansC * b;
            expr = `${fmtTerm(a, v, true)} ÷ ${b < 0 ? '('+b+')' : b}`;
            ans = fmtTerm(ansC, v, true) || "0";
            hint = `① 나눗셈도 마찬가지로 숫자끼리 먼저 나눕니다.\n👉 ${a} ÷ ${b} = ${ansC}\n② 결과 뒤에 문자 ${v}를 그대로 붙여줍니다.`;
            trap1 = fmtTerm(a*b, v, true) || "0";
            trap2 = (ansC).toString();
          }
          break;
        case 3: // 단항식 + 수 (결합 불가)
          {
            let a = getC(-9, 9, allowNeg);
            let b = getC(-9, 9, allowNeg);
            expr = joinTerms(fmtTerm(a, v, true), fmtTerm(b, '', false));
            ans = "다른 것은 답이 아니다.";
            hint = `① ${fmtTerm(a, v, true)}는 문자가 있는 '일차항'이고, ${b > 0 ? '+'+b : b}는 숫자만 있는 '상수항'입니다.\n② 사과와 연필을 더할 수 없듯이, 종류가 다른 두 항은 덧셈이나 뺄셈을 할 수 없어요.`;
            trap1 = fmtTerm(a+b, v, true) || "0";
            trap2 = (a+b).toString();
          }
          break;
        case 4: // 단항식 + 단항식
          {
            let a = getC(-9, 9, allowNeg);
            let b = getC(-9, 9, allowNeg);
            expr = joinTerms(fmtTerm(a, v, true), fmtTerm(b, v, false));
            ans = fmtTerm(a+b, v, true) || "0";
            hint = `① 두 항 모두 문자 ${v}를 가지고 있는 '동류항'입니다!\n② 동류항의 덧셈, 뺄셈은 앞의 숫자(계수)끼리만 계산합니다.\n👉 ${a} ${b > 0 ? '+ '+b : '- '+Math.abs(b)} = ${a+b}\n③ 마지막으로 문자 ${v}를 붙여줍니다.`;
            trap1 = fmtTerm(a+b, v+'^2', true) || "0";
            trap2 = fmtTerm(a*b, v, true) || "0";
          }
          break;
        case 4.5: // 단항식 + 단항식 (다른 문자)
          {
            let a = getC(-9, 9, allowNeg);
            let b = getC(-9, 9, allowNeg);
            let v2 = v === 'a' ? 'b' : 'y';
            expr = joinTerms(fmtTerm(a, v, true), fmtTerm(b, v2, false));
            ans = "다른 것은 답이 아니다.";
            hint = `① 앞의 항은 문자 ${v}, 뒤의 항은 문자 ${v2}를 가지고 있습니다.\n② 문자가 서로 다르면 동류항이 아니기 때문에 덧셈, 뺄셈을 할 수 없습니다.`;
            trap1 = fmtTerm(a+b, v, true) || "0";
            trap2 = fmtTerm(a+b, v+v2, true) || "0";
          }
          break;
        case 5: // 일차식 + 일차식
          {
            let a = getC(-5, 5, allowNeg);
            let b = getC(-5, 5, allowNeg);
            let c = getC(-5, 5, allowNeg);
            let d = getC(-5, 5, allowNeg);
            expr = joinTerms(fmtTerm(a, v, true), fmtTerm(b, '', false), fmtTerm(c, v, false), fmtTerm(d, '', false));
            ans = joinTerms(fmtTerm(a+c, v, true), fmtTerm(b+d, '', (a+c)===0)) || "0";
            hint = `① 끼리끼리 모으기: ${v}항은 ${v}항끼리, 숫자는 숫자끼리 모아서 풉니다.\n② ${v}항 계산: ${fmtTerm(a,v,true)} ${c >= 0 ? '+' : '-'} ${Math.abs(c)}${v} = ${fmtTerm(a+c,v,true) || '0'}\n③ 상수항 계산: ${b > 0 ? '+'+b : b} ${d >= 0 ? '+' : '-'} ${Math.abs(d)} = ${b+d > 0 ? '+'+(b+d) : b+d}`;
            trap1 = joinTerms(fmtTerm(a+c, v, true), fmtTerm(b-d, '', (a+c)===0)) || "0";
            trap2 = fmtTerm(a+b+c+d, v, true) || "0";
          }
          break;
        case 6: // 분배법칙
          {
            let a = getMultiplier(-5, 5, allowNeg);
            let b = getC(-5, 5, allowNeg);
            let c = getC(-5, 5, allowNeg);
            expr = `${a === -1 ? "-" : a}(${joinTerms(fmtTerm(b, v, true), fmtTerm(c, '', false))})`;
            ans = joinTerms(fmtTerm(a*b, v, true), fmtTerm(a*c, '', (a*b)===0)) || "0";
            hint = `① 분배법칙: 괄호 밖의 수 ${a}를 괄호 안의 두 항에 각각 곱합니다.\n② 첫 번째 곱하기: ${a} × ${fmtTerm(b,v,true)} = ${fmtTerm(a*b,v,true)}\n③ 두 번째 곱하기: ${a} × (${c}) = ${a*c > 0 ? '+'+(a*c) : a*c}`;
            trap1 = joinTerms(fmtTerm(a*b, v, true), fmtTerm(c, '', (a*b)===0)) || "0";
            trap2 = joinTerms(fmtTerm(a+b, v, true), fmtTerm(a+c, '', (a+b)===0)) || "0";
          }
          break;
        case 7: // 분배법칙 + 일차식
          {
            let a1 = getMultiplier(-3, 3, allowNeg), b1 = getC(-4, 4, allowNeg), c1 = getC(-4, 4, allowNeg);
            let a2 = getMultiplier(-3, 3, allowNeg), b2 = getC(-4, 4, allowNeg), c2 = getC(-4, 4, allowNeg);
            
            // 괄호 앞 계수가 1이나 -1일 경우 1 생략 포맷팅
            let a2Str = a2 === 1 ? " + " : (a2 === -1 ? " - " : (a2 > 0 ? ` + ${a2}` : ` - ${Math.abs(a2)}`));
            
            expr = `${a1 === -1 ? "-" : a1}(${joinTerms(fmtTerm(b1, v, true), fmtTerm(c1, '', false))})${a2Str}(${joinTerms(fmtTerm(b2, v, true), fmtTerm(c2, '', false))})`;
            ans = joinTerms(fmtTerm(a1*b1 + a2*b2, v, true), fmtTerm(a1*c1 + a2*c2, '', (a1*b1 + a2*b2)===0)) || "0";
            
            // [이전 단일 단 레이아웃 백업]
            // 언제라도 아래 주석을 풀고 기존 hint 변수 설정을 활성화하면 이전 버전으로 돌아갑니다.
            /*
            hint = `① 각각 분배법칙으로 괄호를 먼저 풉니다.\n  앞쪽: ${fmtTerm(a1*b1, v, true)} ${a1*c1 > 0 ? '+'+(a1*c1) : a1*c1}\n  뒤쪽: ${fmtTerm(a2*b2, v, true)} ${a2*c2 > 0 ? '+'+(a2*c2) : a2*c2}\n② 끼리끼리(동류항) 덧셈, 뺄셈을 합니다.\n  ${v} 항: ${a1*b1}${v} ${a2*b2 > 0 ? '+'+(a2*b2) : a2*b2}${v} = ${fmtTerm(a1*b1+a2*b2, v, true) || '0'}\n  상수항: ${a1*c1} ${a2*c2 > 0 ? '+'+(a2*c2) : a2*c2} = ${a1*c1+a2*c2 > 0 ? '+'+(a1*c1+a2*c2) : a1*c1+a2*c2}`;
            */

            // [새로운 다단 레이아웃 분리용 (||| 구분자 사용)]
            hint = `① 각각 분배법칙으로 괄호를 먼저 풉니다.\n앞쪽: ${fmtTerm(a1*b1, v, true)} ${a1*c1 > 0 ? '+'+(a1*c1) : a1*c1}\n뒤쪽: ${fmtTerm(a2*b2, v, true)} ${a2*c2 > 0 ? '+'+(a2*c2) : a2*c2}|||② 끼리끼리(동류항) 덧셈, 뺄셈을 합니다.\n${v} 항: ${a1*b1}${v} ${a2*b2 > 0 ? '+'+(a2*b2) : a2*b2}${v} = ${fmtTerm(a1*b1+a2*b2, v, true) || '0'}\n상수항: ${a1*c1} ${a2*c2 > 0 ? '+'+(a2*c2) : a2*c2} = ${a1*c1+a2*c2 > 0 ? '+'+(a1*c1+a2*c2) : a1*c1+a2*c2}`;

            trap1 = joinTerms(fmtTerm(a1*b1 + a2*b2, v, true), fmtTerm(c1 + c2, '', (a1*b1 + a2*b2)===0)) || "0";
            trap2 = joinTerms(fmtTerm(a1*b1 - a2*b2, v, true), fmtTerm(a1*c1 - a2*c2, '', (a1*b1 - a2*b2)===0)) || "0";
          }
          break;
      }

      const finalOptions = generateOptionsList(ans, trap1, trap2, v, targetPos);
      return { ans: ans, options: finalOptions, exprDisplay: expr, hint: hint };
    };

    // 6번 선지가 텍스트로 고정되어 있으므로, 5개의 수학 선지 위치(0~4)를 관리하는 5-Bag 시스템
    const PosGenerator = {
      bag: [],
      currentPos: null,
      next: function() {
        if (this.currentPos !== null) return this.currentPos;
        if (this.bag.length === 0) {
          this.bag = [0, 1, 2, 3, 4];
          for (let i = this.bag.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [this.bag[i], this.bag[j]] = [this.bag[j], this.bag[i]];
          }
        }
        this.currentPos = this.bag.pop();
        return this.currentPos;
      },
      commit: function() { this.currentPos = null; },
      reset: function() { this.bag = []; this.currentPos = null; }
    };

    const generateQuestions = (count, mode = 'normal') => {
      PosGenerator.reset();
      const qs = [];
      const usedSignatures = new Set(); 
      
      const isExpertRotation = (mode === 'advanced' && count === 50);
      const rotationPattern = [6, 7, 5, 2, 7, 4, 1, 7, 5, 7, 3, 6, 7, 5, 7];

      for(let i=0; i<count; i++) {
        let level = mode;
        let t;
        
        if (isExpertRotation) {
           t = rotationPattern[i % rotationPattern.length];
           level = 'level4';
        } else {
           if (mode === 'positive_only') level = 'level1';
           if (mode === 'basic_negative') level = 'level2';
           if (mode === 'normal') level = 'level3';
           if (mode === 'advanced') level = 'level4';
           
           let types = [];
           if (level === 'level1') types = [1, 2, 3, 4];
           if (level === 'level2') types = [1, 2, 3, 4, 4.5];
           if (level === 'level3') types = [5];
           if (level === 'level4') types = [6, 7];
           t = types[Math.floor(Math.random() * types.length)];
        }

        let allowNeg = level !== 'level1';
        let isTextAnswer = (t === 3 || t === 4.5);
        let posForMath = isTextAnswer ? null : PosGenerator.next();
        
        let qData;
        let signature;
        let totalAttempts = 0;
        
        do {
          qData = generateLinearQuestion(t, allowNeg, posForMath);
          signature = `${qData.exprDisplay}_${qData.ans}`;
          totalAttempts++;
        } while (usedSignatures.has(signature) && totalAttempts < 50); 
        
        usedSignatures.add(signature);
        if (!isTextAnswer) {
            PosGenerator.commit();
        }
        
        qs.push({ ...qData, answer: qData.ans });
      }
      return qs;
    };

    const generateTrainingQuestions = (count) => {
      const qs = [];
      for(let i=0; i<count; i++) {
        let level;
        if (i === 1) level = 1;
        else if (i === 5) level = 2;
        else level = (i % 2 === 0) ? 3 : 4; 
        
        let p, r, q, s, a, b, c;
        let isDuplicate;
        
        do {
            isDuplicate = false;
            if (level === 1) { p = 1; r = 1; q = randInt(1, 6); s = randInt(1, 6); }
            else if (level === 2) { p = 1; r = 1; do { q = randInt(-6, 6); s = randInt(-6, 6); } while (q + s === 0 || q === 0 || s === 0); }
            else if (level === 3) { const primes = [2, 3, 5]; p = primes[Math.floor(Math.random() * primes.length)]; r = 1; do { q = randInt(-5, 5); s = randInt(-5, 5); a = p * r; b = p * s + r * q; c = q * s; } while (b === 0 || c === 0 || Math.abs(gcd(Math.abs(a), gcd(Math.abs(b), Math.abs(c)))) !== 1); }
            else { do { p = randInt(2, 4); r = randInt(2, 4); q = randInt(-5, 5); s = randInt(-5, 5); a = p * r; b = p * s + r * q; c = q * s; } while (b === 0 || c === 0 || gcd(p, Math.abs(q)) !== 1 || gcd(r, Math.abs(s)) !== 1 || Math.abs(gcd(Math.abs(a), gcd(Math.abs(b), Math.abs(c)))) !== 1); }
            
            a = p * r; b = p * s + r * q; c = q * s;
            
            for (let j = 0; j < qs.length; j++) {
                if (qs[j].a === a && qs[j].b === b && qs[j].c === c) {
                    isDuplicate = true;
                    break;
                }
            }
        } while (isDuplicate);

        qs.push({ a, b, c, p, q, r, s, exprDisplay: formatQuadraticJSX(a, b, c) });
      }
      return qs;
    };

      const linesRef = useRef([]);
      const historyStepRef = useRef(0);

      useEffect(() => { linesRef.current = lines; historyStepRef.current = historyStep; }, [lines, historyStep]);

      const redraw = (canvas, linesData, step) => {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.0; ctx.strokeStyle = '#F97316';
        for (let i = 0; i < step; i++) {
          const line = linesData[i];
          if (!line || line.points.length === 0) continue;
          ctx.beginPath(); ctx.moveTo(line.points[0].x, line.points[0].y);
          for (let j = 1; j < line.points.length; j++) { ctx.lineTo(line.points[j].x, line.points[j].y); }
          ctx.stroke();
        }
      };

      const clearCanvas = () => {
        setLines([]); setHistoryStep(0);
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      };

      useEffect(() => { clearCanvas(); }, [currentIndex]);

      useEffect(() => {
        const canvas = canvasRef.current;
        const container = canvas.parentElement;
        if (!canvas || !container) return;
        
        const resizeObserver = new ResizeObserver(entries => {
          for (let entry of entries) {
            const { width, height } = entry.contentRect;
            canvas.width = width; canvas.height = height;
            redraw(canvas, linesRef.current, historyStepRef.current);
          }
        });
        resizeObserver.observe(container);
        return () => resizeObserver.disconnect();
      }, []);

      const getCoordinates = (e, canvas) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const startDrawing = (e) => {
        if (!isActive) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCoordinates(e, canvas);
        ctx.beginPath(); ctx.moveTo(x, y); setIsDrawing(true); currentLineRef.current = { points: [{ x, y }] };
      };

      const draw = (e) => {
        if (!isDrawing || !isActive) return;
        if (e.cancelable) e.preventDefault();

        if (currentLineRef.current) { currentLineRef.current.points.push({ x, y }); }
      };

      const stopDrawing = () => {

        setIsDrawing(false);

        }

             {isActive && (

                  <button onClick={undo} disabled={historyStep === 0} className="p-1.5 bg-white border border-gray-200 rounded-lg shadow-sm text-gray-500 hover:text-indigo-500 disabled:opacity-40 active:scale-95 transition-all" title="실행 취소"><UndoIcon className="w-3.5 h-3.5 md:w-4 md:h-4" /></button>

             </div>
           )}
        </div>
      );
    };

              let sortedId = [f1, f2].sort().join('|');
              return { f1, f2, id: `(${f1})(${f2})`, sortedId, isCorrect };
          };

          const set = new Map();
          const seenIds = new Set(); 

          const tryAddChoice = (a_v, c_v, b_v, d_v, isCorrect = false) => {
              if (set.size >= 4) return;
              const choice = makeChoice(a_v, c_v, b_v, d_v, isCorrect);
              if (!seenIds.has(choice.sortedId)) {
                  set.set(choice.id, choice);
                  seenIds.add(choice.sortedId);
              }
          };

          tryAddChoice(a, d, b, c, false);
          tryAddChoice(a, -c, b, -d, false);
          
          let offset = 1;
          while (set.size < 4) {
              tryAddChoice(a, c + offset, b, d - offset, false);
              tryAddChoice(a, c - offset, b, d + offset, false); 
              offset++;
              if (offset > 50) break;
          }
          
          const arr = Array.from(set.values());

                  <section>
                    <h4 className="text-lg font-bold text-gray-800 mb-2 flex items-center before:content-[''] before:w-1 before:h-4 before:bg-indigo-500 before:mr-2 before:rounded-sm">1. 일차식의 계산 업데이트 내역</h4>
                    <ul className="list-disc pl-5 space-y-1.5 text-gray-600">
                      <li>기존의 "이차식의 인수 찾기" 퀴즈를 <strong>"일차식의 덧셈과 뺄셈"</strong>으로 전면 개편했습니다.</li>
                      <li>모든 문제는 단항식의 곱셈/나눗셈부터 동류항 계산, 분배법칙을 포함하는 복잡한 계산까지 7가지 유형으로 <strong>6지선다형</strong>으로 제공됩니다.</li>
                      <li>Firebase 데이터베이스 수집 경로를 분리(hallOfFame_linear)하여 기존 랭킹과 혼용되지 않도록 처리했습니다.</li>
                      <li>학생들이 원리를 파악할 수 있도록 언제든 열어볼 수 있는 <strong>Hint 가이드 버튼</strong>을 상시 활성화해두었습니다.</li>
                      <li>"다른 것은 답이 아니다.", "다른 셋은 답이 아니다" 등의 텍스트형 함정 선지도 자연스럽게 처리됩니다.</li>
                    </ul>
                  </section>
                  <section>
                    <h4 className="text-lg font-bold text-gray-800 mb-2 flex items-center before:content-[''] before:w-1 before:h-4 before:bg-indigo-500 before:mr-2 before:rounded-sm">2. 현재 구현된 핵심 기능 요약</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <h5 className="font-bold text-indigo-600 mb-1">🎮 다이나믹 수학 문제 생성기</h5>
                        <p>일차식의 계산 규칙에 맞게 무한정 랜덤 문제를 생성하며, 함정 선지를 지능적으로 배치합니다.</p>
                      </div>
                      <div className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <h5 className="font-bold text-indigo-600 mb-1">✍️ 디지털 연습장 (Canvas API)</h5>
                        <p>학생들이 별도의 종이 없이 화면에 바로 필기하며 풀 수 있습니다. 터치스크린과 마우스를 모두 지원하며, Undo(실행 취소)/Redo(다시 실행)/Clear 기능을 지원합니다.</p>
                      </div>
                      <div className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <h5 className="font-bold text-indigo-600 mb-1">📊 실시간 피드백 및 랭크</h5>
                        <p>타이머, 정답률, 연속 정답뿐만 아니라 속도와 난이도에 따른 <strong>실시간 포인트 획득/감점 시스템</strong>을 지원합니다. (사용자 선택에 따른 팝업 ON/OFF 가능)</p>
                      </div>
                      <div className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <h5 className="font-bold text-indigo-600 mb-1">📝 명예의 전당 및 오답 노트</h5>
                        <p>Firebase와 연동된 온라인 랭킹보드에서 반 친구들과 실시간으로 순위를 겨룰 수 있으며, 퀴즈가 끝난 뒤 틀린 문제들만 모아 완벽하게 숙지할 때까지 반복해서 다시 풀 수 있습니다.</p>
                      </div>
                    </div>
                  </section>
                  
                </div>
              </div>
            </div>
          )}

          {/* 글로벌 명예의 전당 */}
          {showGlobalLeaderboard && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 md:p-6">
              <div className="bg-gray-900 rounded-2xl shadow-2xl p-4 md:p-6 max-w-2xl w-full max-h-[85vh] flex flex-col animate-fade-in relative border border-gray-700">
                <button onClick={() => { setShowGlobalLeaderboard(false); setIsAdmin(false); }} className="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors">
                  <XCircle className="w-6 h-6" />
                </button>
                
                <h3 className="text-2xl md:text-3xl font-extrabold text-yellow-400 mb-6 text-center tracking-widest mt-2">
                  🏆 HALL OF FAME 🏆
                </h3>
                
                <div className="bg-gray-800 rounded-xl p-2 md:p-4 overflow-y-auto flex-1 dark-scrollbar border border-gray-700">
                  <table className="w-full text-left text-gray-300 text-[13px] md:text-base min-w-[320px]">
                    <thead>
                      <tr className="border-b border-gray-700 text-gray-500">
                        <th className="py-2 text-center w-12">순위</th>
                        <th className="py-2 pl-2">닉네임</th>
                        <th className="py-2 text-right">점수</th>
                        <th className="py-2 text-right whitespace-nowrap">평균 응답시간</th>
                        <th className="py-2 text-right whitespace-nowrap">정확도</th>
                        {isAdmin && <th className="py-2 text-center text-red-400 whitespace-nowrap">관리</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {globalLeaderboardData.map((record, idx) => {
                        let rankMedal = `${idx + 1}`;
                        let rankStyle = "text-gray-400";
                        if (idx === 0) { rankMedal = '🥇'; rankStyle = "text-yellow-400 font-black text-lg md:text-xl"; }
                        if (idx === 1) { rankMedal = '🥈'; rankStyle = "text-gray-300 font-bold text-lg"; }
                        if (idx === 2) { rankMedal = '🥉'; rankStyle = "text-amber-600 font-bold text-lg"; }

                        return (
                          <tr key={record.id} className="border-b border-gray-700/50 hover:bg-gray-700 transition-colors">
                            <td className={`py-3 text-center ${rankStyle}`}>{rankMedal}</td>
                            <td className={`py-3 pl-2 font-extrabold tracking-wide ${idx < 3 ? 'text-white' : 'text-gray-300'}`}>{record.name}</td>
                            <td className={`py-3 text-right font-bold ${record.score < 0 ? 'text-red-400' : 'text-yellow-400'}`}>
                              {record.score.toLocaleString()}
                            </td>
                            <td className="py-3 text-right text-gray-400 font-mono whitespace-nowrap">{record.time}s</td>
                            <td className="py-3 text-right text-gray-400 whitespace-nowrap">{record.accuracy}%</td>
                            {isAdmin && (
                              <td className="py-3 text-center">
                                <button onClick={() => setDeleteTarget(record.id)} className="text-red-500 hover:text-red-400 p-1 bg-red-500/10 rounded active:scale-95 transition-transform">
                                  <Trash2 className="w-4 h-4 mx-auto" />
                                </button>
                              </td>
                            )}
                          </tr>
                        )
                      })}
                      {globalLeaderboardData.length === 0 && (
                        <tr>
                          <td colSpan={isAdmin ? 6 : 5} className="py-10 text-center text-gray-500 font-medium">
                            아직 등록된 기록이 없습니다.<br/>첫 번째 전설이 되어보세요!
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
