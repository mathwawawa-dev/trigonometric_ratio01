<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="삼각비 마스터 — 게임 화면">
  <meta name="theme-color" content="#0a0e1a">
  <title>삼각비 마스터 — 게임 중</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/questionsData.js"></script>
  <script src="js/questionLoader.js"></script>
  <script src="js/quizEngine.js"></script>

  <!-- 오프닝 테마 적용 (플리커 방지) -->
  <script>
    (function() {
      var t = localStorage.getItem('triTheme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

</head>
<body>

<!-- ── 다크/라이트 + 토글 패널 (우상단 Fixed) ─────────────── -->
<div id="floating-toggle-panel" class="floating-toggle-panel">
  <button class="toggle-item" id="toggle-avgtime" title="평균 응답시간">
    <svg class="toggle-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    <span class="toggle-label">응답시간</span>
    <div class="toggle-track" id="track-avgtime"><div class="toggle-thumb"></div></div>
  </button>
  <button class="toggle-item" id="toggle-elapsed" title="경과 시간">
    <svg class="toggle-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span class="toggle-label">경과시간</span>
    <div class="toggle-track" id="track-elapsed"><div class="toggle-thumb"></div></div>
  </button>
  <button class="toggle-item" id="toggle-scorepop" title="점수 팝업">
    <svg class="toggle-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    <span class="toggle-label">점수팝업</span>
    <div class="toggle-track toggle-track--on" id="track-scorepop"><div class="toggle-thumb toggle-thumb--on"></div></div>
  </button>
  <button class="toggle-item" id="toggle-theme" title="다크/라이트 모드">
    <svg class="toggle-icon" id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="toggle-icon" id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <span class="toggle-label">다크모드</span>
    <div class="toggle-track" id="track-theme"><div class="toggle-thumb"></div></div>
  </button>
</div>

<!-- ── 홈 버튼 (Fixed 우하단) ──────────────────────────── -->
<button id="floating-home-btn" aria-label="홈으로" title="시작 화면으로">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
</button>

<!-- ── 피드백 스탬프 오버레이 ─────────────────────────── -->
<div id="feedback-overlay" aria-hidden="true">
  <div id="feedback-stamp" class="feedback-stamp"></div>
</div>

<!-- ── 결과 오버레이 ──────────────────────────────────── -->
<div id="result-overlay" role="dialog" aria-modal="true" aria-label="게임 결과">
  <div class="result-inner">
    <img id="result-pokemon-img" class="result-pokemon" src="" alt="포켓몬">
    <h2 class="result-title" id="result-title">세션 종료!</h2>
    <div class="result-stats">
      <div class="result-stat">
        <span class="result-stat__val result-stat__val--primary" id="r-score">0</span>
        <span class="result-stat__label">총점</span>
      </div>
      <div class="result-stat">
        <span class="result-stat__val result-stat__val--success" id="r-correct">0/0</span>
        <span class="result-stat__label">정답률</span>
      </div>
      <div class="result-stat">
        <span class="result-stat__val result-stat__val--warning" id="r-combo">0</span>
        <span class="result-stat__label">최고 콤보</span>
      </div>
      <div class="result-stat">
        <span class="result-stat__val" id="r-time">0s</span>
        <span class="result-stat__label">평균 응답속도</span>
      </div>
    </div>
    <div class="stars" id="r-stars" aria-label="별점"></div>
    <div class="result-btns">
      <button class="btn btn--primary btn--full btn--lg" id="detail-btn">📊 상세 결과 보기</button>
      <button class="btn btn--secondary btn--full" id="retry-btn">🔄 다시 도전</button>
      <button class="btn btn--ghost btn--full" id="home-btn">🏠 처음으로</button>
    </div>
  </div>
</div>

<!-- ── 메인 게임 래퍼 ──────────────────────────────────── -->
<div class="game-wrap page-enter">

  <!-- HUD -->
  <div class="hud">
    <!-- HUD 좌측: 실시간 스탯 배지 (SVG 아이콘, 테두리/배경 없음) -->
    <div class="hud-left">
      <div class="stat-badge stat-badge--blue" id="hud-accuracy" title="정답률">
        <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <span id="hud-accuracy-val">0%</span>
      </div>
      <div class="stat-badge stat-badge--purple" id="hud-score-badge" title="점수">
        <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        <span id="hud-score">0</span>
      </div>
      <div class="stat-badge stat-badge--orange" id="hud-combo-badge" title="연속 정답">
        <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        <span id="hud-combo">0</span>연속
      </div>
      <div class="stat-badge stat-badge--green" id="hud-avgtime-badge" title="평균 응답시간" style="display:none">
        <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span id="hud-avgtime-val">-</span>s
      </div>
      <div class="stat-badge stat-badge--gray" id="hud-elapsed-badge" title="경과 시간" style="display:none">
        <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="hud-elapsed-val">0</span>s
      </div>
    </div>

    <!-- 우측: 문항번호만 (토글 패널은 floating으로 이동) -->
    <div class="hud-right">
      <div class="q-counter">
        <span class="q-counter__current" id="hud-qnum">1</span>
        <span class="q-counter__total" id="hud-qtotal">/10</span>
      </div>
    </div>
  </div>


  <!-- 타이머 -->
  <div class="timer-section">
    <div class="timer-meta">
      <div class="progress-dots" id="progress-dots" aria-label="진행 현황"></div>
      <span class="timer-countdown" id="timer-display">30</span>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar-fill" id="timer-bar"></div>
    </div>
  </div>

  <!-- 삼각형 이미지 -->
  <div class="tri-section">
    <div class="tri-image-frame">
      <!-- 질문 -->
      <div class="question-section">
        <p id="question-text" aria-live="polite">문제를 불러오는 중...</p>
      </div>
      <img id="tri-img" src="" alt="삼각형 문제 이미지" class="loading">
    </div>
    <div class="tri-meta">
      <span class="type-badge" id="type-badge">유형①</span>
      <span class="trig-badge" id="trig-badge">sin</span>
    </div>
  </div>



  <!-- 선지 4개 (1행 4열) -->
  <div id="choices-grid" role="group" aria-label="답안 선택">
    <button class="choice-btn" data-label="①" data-key="1" data-idx="0" id="choice-0" aria-label="선지 1"></button>
    <button class="choice-btn" data-label="②" data-key="2" data-idx="1" id="choice-1" aria-label="선지 2"></button>
    <button class="choice-btn" data-label="③" data-key="3" data-idx="2" id="choice-2" aria-label="선지 3"></button>
    <button class="choice-btn" data-label="④" data-key="4" data-idx="3" id="choice-3" aria-label="선지 4"></button>
  </div>


  <!-- 정답 해설 배너 -->
  <div id="answer-banner" class="answer-banner" role="status"></div>

  <!-- 다음 버튼 -->
  <button class="btn btn--primary btn--full btn--lg" id="next-btn" aria-label="다음 문제">
    다음 문제 →
  </button>

</div><!-- /game-wrap -->

<script>
/* ============================================================
   game.html — 오케스트레이션 레이어 (STEP 3-2)
   실제 로직: js/utils.js · js/renderer.js
              js/questionLoader.js · js/quizEngine.js
   ============================================================ */

// ── 트레이너 세션 복원 ────────────────────────────────────
let trainer;
try { trainer = JSON.parse(sessionStorage.getItem('trainer') || 'null'); }
catch(e) { trainer = null; }
if (!trainer) { window.location.href = 'index.html'; throw new Error('no trainer'); }

const { difficulty } = trainer;

// ── 선지 클릭 이벤트 ──────────────────────────────────────
document.querySelectorAll('.choice-btn').forEach(btn => {
  btn.addEventListener('click', () =>
    TriQuizEngine.onChoiceClick(parseInt(btn.dataset.idx))
  );
});

// ── 다음 문항 버튼 ────────────────────────────────────────
document.getElementById('next-btn').addEventListener('click', () =>
  TriQuizEngine.nextQuestion()
);

// ── 결과 오버레이 버튼 ────────────────────────────────────
document.getElementById('detail-btn')?.addEventListener('click', () => {
  window.location.href = 'result.html';
});

document.getElementById('retry-btn').addEventListener('click', () => {
  document.getElementById('result-overlay').classList.remove('show');
  const st = TriQuizEngine.getState();
  TriQuizEngine.resetGame(st?.allQuestions, difficulty);
});

document.getElementById('home-btn').addEventListener('click', () => {
  window.location.href = 'index.html';
});

// ── 키보드 단축키 (1~4: 선지, Numpad1~4: 선지, Enter/Space: 다음) ─────
document.addEventListener('keydown', e => {
  const st = TriQuizEngine.getState();
  // 일반 1~4 및 Numpad1~4 모두 지원
  const numMap = { '1':'1','2':'2','3':'3','4':'4',
                   'Numpad1':'1','Numpad2':'2','Numpad3':'3','Numpad4':'4' };
  const key = numMap[e.key] || numMap[e.code];
  if (key && st && !st.answered) {
    e.preventDefault();
    TriQuizEngine.onChoiceClick(parseInt(key) - 1);
  }
  if ((e.key === 'Enter' || e.key === ' ') && st?.answered) {
    const nextBtn = document.getElementById('next-btn');
    if (nextBtn.style.display !== 'none') nextBtn.click();
  }
});

// ── 테마 토글 (토글 패널 내에서 처리) ───────────────────────────────
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('triTheme', t);
  const isDark = t === 'dark';
  // 토글 패널 다크모드 아이콘 전환
  const moon = document.getElementById('theme-icon-moon');
  const sun  = document.getElementById('theme-icon-sun');
  if (moon) moon.style.display = isDark ? 'none' : '';
  if (sun)  sun.style.display  = isDark ? '' : 'none';
  // 토글 트랙 상태
  const track = document.getElementById('track-theme');
  const thumb = track ? track.querySelector('.toggle-thumb') : null;
  if (track) {
    track.classList.toggle('toggle-track--on', isDark);
    if (thumb) thumb.classList.toggle('toggle-thumb--on', isDark);
  }
}
applyTheme(localStorage.getItem('triTheme') || 'light');

const themeToggleBtn = document.getElementById('toggle-theme');
if (themeToggleBtn) {
  themeToggleBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });
}

// ── 홈 버튼 ──────────────────────────────────────────────────
document.getElementById('floating-home-btn').addEventListener('click', () => {
  window.location.href = 'index.html';
});


// ── 초기 데이터 로드 & 게임 시작 ─────────────────────────
TriLoader.initQuestions({
  difficulty,
  onSuccess(allQ, session) {
    TriQuizEngine.init({ trainer, allQuestions: allQ, session });
  },
  onError(err) {
    document.getElementById('question-text').innerHTML =
      '<span style="font-size:var(--text-sm);color:var(--danger-400)">' +
      '\u26a0\ufe0f \ub370\uc774\ud130 \ub85c\ub4dc \uc2e4\ud328<br>' +
      '<code style="font-size:0.85em">' + err.message + '</code></span>';
    console.error('[game.html] \ub85c\ub4dc \uc2e4\ud328:', err);
  },
});
</script>

</body>
</html>
